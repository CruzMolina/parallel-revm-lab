name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: test
        run: cargo test --workspace --all-features
      - name: cli analyze fixture
        run: |
          cargo run -p parallel-revm-lab -- analyze-fixture \
            --fixture fixtures/base-mini-trace.json \
            --out reports/ci-base-mini-trace.parallelism.json \
            --markdown reports/ci-base-mini-trace.md \
            --html reports/ci-base-mini-trace.html \
            --trace reports/ci-base-mini-trace.schedule.trace.json
      - name: cli analyze geth trace fixture
        run: |
          cargo run -p parallel-revm-lab -- analyze-trace \
            --format geth-struct-logs \
            --fixture fixtures/geth-mini-struct-logs.json \
            --out reports/ci-geth-mini.parallelism.json \
            --markdown reports/ci-geth-mini.md \
            --html reports/ci-geth-mini.html \
            --trace reports/ci-geth-mini.schedule.trace.json
      - name: cli help
        run: cargo run -p parallel-revm-lab -- --help
      - name: cli verify
        run: cargo run -p parallel-revm-lab -- verify --workload mixed --txs 50 --conflicts 0.0,0.5 --threads 1,2 --seed-start 1 --seed-end 5
